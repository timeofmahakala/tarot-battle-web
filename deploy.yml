name: Deploy Tarot Battle Web

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack game project
        run: |
          rm -rf project build
          mkdir -p project build
          unzip -o tarot_web_src.zip -d project

      - name: Bundle Korean font
        run: |
          mkdir -p project/assets/fonts
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/nanumgothic/NanumGothic-Regular.ttf" \
            -o project/assets/fonts/NanumGothic-Regular.ttf
          test -s project/assets/fonts/NanumGothic-Regular.ttf
          cat >> project/project.godot <<'EOF'

          [gui]
          theme/custom_font="res://assets/fonts/NanumGothic-Regular.ttf"
          EOF

      - name: Setup Godot
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: true

      - name: Export unique Web build
        run: |
          BUILD_BASE="game-${GITHUB_SHA}"
          godot --headless --path project --export-release "Web" "$GITHUB_WORKSPACE/build/${BUILD_BASE}.html"
          mv "$GITHUB_WORKSPACE/build/${BUILD_BASE}.html" "$GITHUB_WORKSPACE/build/index.html"
          printf '%s\n' "$GITHUB_SHA" > "$GITHUB_WORKSPACE/build/version.txt"
          touch "$GITHUB_WORKSPACE/build/.nojekyll"
          ls -lah "$GITHUB_WORKSPACE/build"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
